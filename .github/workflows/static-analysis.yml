name: Static analysis

on:
  push:
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-analysis.txt
            requirements-analysis-lock.txt
      - run: sudo apt-get update && sudo apt-get install --yes libegl1 libopengl0 libgl1 libpulse0
      - name: Install pinned analysis tools and Qt import metadata
        run: python -m pip install -r requirements-analysis.txt
      - name: Run analysis gate (separate from pytest)
        run: |
          mkdir -p artifacts/static-analysis/ci
          set +e
          python tools/run_static_analysis.py check --output artifacts/static-analysis/ci \
            > artifacts/static-analysis/ci/analysis.log 2>&1
          result=$?
          cat artifacts/static-analysis/ci/analysis.log
          printf '%s\n' "$result" > artifacts/static-analysis/ci/exit-code.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-report
          path: artifacts/static-analysis/ci/
          if-no-files-found: error
