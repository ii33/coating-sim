name: Dependency manager source checks

on:
  workflow_dispatch:
  push:
    branches: [main, "validation/python-bootstrap-*"]
    paths:
      - dependency_manager.py
      - dependency_manager.cmd
      - tools/dependency_manager/**
      - tools/build_dependency_manager.py
      - tools/build_dependency_manager_pyinstaller.py
      - tests/test_dependency*.py
      - tests/dependency_bootstrap_windows_offline.ps1
      - requirements-dependency-manager-build.txt
      - .github/workflows/dependency-manager-build.yml

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.16"
          architecture: x64
      - name: Install pinned CI-only test runner
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          if ($LASTEXITCODE -ne 0) { throw 'CI test runner installation failed' }
      - name: Parse Windows bootstrap and probe installed Python
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $script = Join-Path $PWD 'tools/dependency_manager/bootstrap_windows.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          $python = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          & powershell.exe -NoLogo -NoProfile -File $script -Cli -CheckOnly -BootstrapPython $python
          if ($LASTEXITCODE -ne 0) { throw 'Read-only Python bootstrap probe failed' }
          & cmd.exe /d /c dependency_manager.cmd -Cli -BootstrapPython $python doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'Source CLI bootstrap/argument forwarding failed' }
      - name: Run offline manager contracts
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          import tempfile
          temp = Path(tempfile.gettempdir())
          print(json.dumps({"temp": str(temp), "canonical_temp": str(temp.resolve()),
                            "ancestors": [{"path": str(p), "symlink": p.is_symlink(),
                                           "junction": p.is_junction()}
                                          for p in (temp, *temp.parents)]}))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Temp path diagnostics failed" }
          # PowerShell does not expand globs for native executables. Pass every
          # dependency test module explicitly so pytest functions/fixtures and
          # unittest.TestCase contracts are both collected and executed.
          $testFiles = @(Get-ChildItem -LiteralPath tests -Filter 'test_dependency*.py' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($testFiles.Count -eq 0) { throw 'No dependency manager test modules found' }
          python -m pytest -v -ra --junitxml=artifacts/dependency-manager/windows-source.xml @testFiles
          if ($LASTEXITCODE -ne 0) { throw 'Dependency manager pytest contracts failed' }
      - name: Preserve Windows source test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-manager-windows-source-results
          path: artifacts/dependency-manager/
          if-no-files-found: warn
