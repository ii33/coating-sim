[pytest]
minversion = 9.1
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*
addopts = --strict-config --strict-markers
markers =
    quick: default quick tier; tests not assigned to a specialized tier
    algorithm: numerical, simulation, optimization, or compute algorithm coverage
    contract: API, boundary, serialization, safety, or integration contract coverage
    qt: Qt/QML UI coverage, run with the offscreen platform
    real_gpu: explicitly opt-in tests that require an actual GPU runtime/device
    live_provider: explicitly opt-in tests that contact a real model provider
    live_remote: explicitly opt-in tests that contact a real remote service
